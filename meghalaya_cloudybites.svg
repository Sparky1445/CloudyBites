<svg viewBox="0 0 1800 760" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <!-- Soft sky gradient matching the website panels -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="55%" stop-color="#dde9f6"/>
      <stop offset="100%" stop-color="#cfe0f1"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcd0e4"/>
      <stop offset="100%" stop-color="#a6c0d8"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cad9ea"/>
      <stop offset="100%" stop-color="#b7cce0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7c66e"/>
      <stop offset="50%" stop-color="#cda04a"/>
      <stop offset="100%" stop-color="#b8872f"/>
    </linearGradient>
    <!-- faint dotted texture like the site background -->
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#1a2744" opacity="0.05"/>
    </pattern>
    <!-- ink hatching for shadows -->
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#1a2744" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect width="1800" height="760" fill="url(#sky)"/>
  <rect width="1800" height="760" fill="url(#dots)"/>

  <!-- drifting clouds (the "Cloudy" theme) -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="230" cy="90" rx="120" ry="34"/>
    <ellipse cx="320" cy="105" rx="90" ry="28"/>
    <ellipse cx="1500" cy="70" rx="140" ry="36"/>
    <ellipse cx="1610" cy="95" rx="95" ry="26"/>
    <ellipse cx="900" cy="60" rx="150" ry="30"/>
  </g>

  <!-- distant hill ranges spanning all three panels for continuity -->
  <path d="M0 300 Q200 230 420 285 T820 270 Q1050 230 1280 285 T1800 265 L1800 760 L0 760 Z" fill="url(#hill2)" opacity="0.55"/>
  <path d="M0 360 Q260 300 520 345 T980 330 Q1240 295 1500 350 T1800 335 L1800 760 L0 760 Z" fill="url(#hill)" opacity="0.7"/>

  <!-- gold sparkle stars scattered like the site -->
  <g fill="url(#gold)">
    <path d="M120 200 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M1680 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M760 160 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
    <path d="M1120 180 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
    <path d="M520 520 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
    <path d="M1320 540 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
  </g>

  <!-- faint panel cut guides (remove before exporting if you like) -->
  <line x1="600" y1="0" x2="600" y2="760" stroke="#1a2744" stroke-width="1" opacity="0.08"/>
  <line x1="1200" y1="0" x2="1200" y2="760" stroke="#1a2744" stroke-width="1" opacity="0.08"/>

  <!-- ===================================================== -->
  <!-- ============ LEFT PANEL: Living Root Bridge ========= -->
  <!-- ===================================================== -->
  <g stroke="#1a2744" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Nohkalikai-style waterfall ribbon -->
    <path d="M150 290 C158 380 142 470 152 560" stroke-width="3" opacity="0.7"/>
    <path d="M168 295 C176 385 160 475 170 565" stroke-width="2" opacity="0.5"/>
    <path d="M132 300 C140 390 124 480 134 560" stroke-width="2" opacity="0.5"/>
    <ellipse cx="150" cy="585" rx="55" ry="14" fill="#cfe0f1" stroke-width="2"/>

    <!-- pine trees (Meghalaya highlands) -->
    <g stroke-width="2">
      <path d="M70 470 l22 -120 22 120 z" fill="#9db89a"/>
      <path d="M70 470 l22 -120 22 120" />
      <line x1="92" y1="470" x2="92" y2="510"/>
      <path d="M30 500 l16 -90 16 90 z" fill="#aec4ab"/>
      <line x1="46" y1="500" x2="46" y2="530"/>
    </g>

    <!-- the famous living root bridge -->
    <path d="M210 430 Q360 540 510 430" stroke-width="6" fill="none"/>
    <path d="M210 430 Q360 510 510 430" stroke-width="3" opacity="0.8"/>
    <!-- twisting roots -->
    <path d="M225 432 Q260 470 245 500" stroke-width="2"/>
    <path d="M280 455 Q300 500 280 540" stroke-width="2"/>
    <path d="M360 470 Q360 520 345 560" stroke-width="2"/>
    <path d="M430 458 Q450 500 435 540" stroke-width="2"/>
    <path d="M480 442 Q510 480 495 515" stroke-width="2"/>
    <!-- handrail roots -->
    <path d="M212 405 Q360 500 508 405" stroke-width="2" opacity="0.7"/>
    <line x1="240" y1="416" x2="248" y2="436"/>
    <line x1="300" y1="438" x2="308" y2="458"/>
    <line x1="420" y1="438" x2="428" y2="456"/>
    <line x1="475" y1="418" x2="483" y2="438"/>

    <!-- Khasi woman in jainsem carrying a 'khoh' basket -->
    <g stroke-width="2.2">
      <!-- head -->
      <circle cx="330" cy="320" r="17" fill="#fdf6e9"/>
      <path d="M315 312 q15 -18 30 0" stroke-width="2"/> <!-- hairline -->
      <!-- body / jainsem (two-piece drape) -->
      <path d="M312 340 L300 430 L360 430 L348 340 Z" fill="#f3ece0"/>
      <path d="M312 340 q18 14 36 0" /> <!-- shoulder drape -->
      <line x1="330" y1="345" x2="330" y2="425" stroke-width="1.5" opacity="0.6"/>
      <!-- arm steadying basket strap -->
      <path d="M348 350 q22 6 18 34" />
      <!-- khoh basket on back (conical bamboo) -->
      <path d="M352 300 L388 300 L372 360 L350 358 Z" fill="url(#hatch)" />
      <path d="M352 300 L388 300 L372 360 L350 358 Z" />
      <line x1="356" y1="318" x2="382" y2="318" stroke-width="1.4"/>
      <line x1="357" y1="334" x2="378" y2="334" stroke-width="1.4"/>
      <!-- strap over forehead -->
      <path d="M347 308 q-20 -8 -18 8" stroke-width="1.8"/>
    </g>
  </g>

  <!-- panel label, small -->
  <text x="300" y="690" text-anchor="middle" font-size="20" fill="#1a2744" opacity="0.55" font-style="italic">Sohra · the living root bridges</text>

  <!-- ===================================================== -->
  <!-- ====== CENTRE PANEL: Wangala drums + title ========== -->
  <!-- ===================================================== -->

  <!-- soft halo behind the title -->
  <ellipse cx="900" cy="300" rx="240" ry="170" fill="#ffffff" opacity="0.35"/>

  <!-- monoliths (Nartiang megaliths) flanking the centre -->
  <g stroke="#1a2744" stroke-width="2.4" stroke-linejoin="round">
    <path d="M690 560 L700 360 L730 360 L740 560 Z" fill="#c3d3e6"/>
    <path d="M712 360 L712 555" stroke-width="1.4" opacity="0.5" fill="none"/>
    <path d="M1060 560 L1070 380 L1098 380 L1108 560 Z" fill="#c3d3e6"/>
    <path d="M1084 380 L1084 555" stroke-width="1.4" opacity="0.5" fill="none"/>
  </g>

  <!-- the calligraphic title -->
  <text x="900" y="285" text-anchor="middle" font-size="120" fill="url(#gold)"
        font-family="'Brush Script MT','Segoe Script',cursive" font-style="italic">Cloudy</text>
  <text x="900" y="395" text-anchor="middle" font-size="92" fill="url(#gold)"
        font-family="'Brush Script MT','Segoe Script',cursive" font-style="italic">Bites</text>
  <text x="900" y="445" text-anchor="middle" font-size="22" fill="#1a2744" letter-spacing="6" opacity="0.8">FLAVOURS OF MEGHALAYA</text>

  <!-- Wangala "hundred drums" festival drummers below the title -->
  <g stroke="#1a2744" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- drummer 1 -->
    <g transform="translate(820,470)">
      <circle cx="0" cy="0" r="15" fill="#fdf6e9"/>
      <!-- Garo feathered headgear -->
      <path d="M-12 -10 l-6 -22 m6 22 l0 -26 m0 0 l8 -22" stroke-width="2"/>
      <path d="M-14 60 L-10 6 L12 6 L14 60" fill="#efe6d6"/>
      <!-- arms to dama drum -->
      <path d="M-10 16 q-26 6 -30 30"/>
      <path d="M12 16 q26 6 30 30"/>
      <!-- long dama drum -->
      <rect x="-46" y="44" width="92" height="26" rx="13" fill="url(#hatch)"/>
      <rect x="-46" y="44" width="92" height="26" rx="13"/>
      <line x1="-30" y1="44" x2="-30" y2="70"/>
      <line x1="30" y1="44" x2="30" y2="70"/>
    </g>
    <!-- drummer 2 -->
    <g transform="translate(980,475)">
      <circle cx="0" cy="0" r="15" fill="#fdf6e9"/>
      <path d="M-12 -10 l-6 -22 m6 22 l0 -26 m0 0 l8 -22" stroke-width="2"/>
      <path d="M-14 60 L-10 6 L12 6 L14 60" fill="#efe6d6"/>
      <path d="M-10 16 q-26 6 -30 30"/>
      <path d="M12 16 q26 6 30 30"/>
      <rect x="-46" y="44" width="92" height="26" rx="13" fill="url(#hatch)"/>
      <rect x="-46" y="44" width="92" height="26" rx="13"/>
      <line x1="-30" y1="44" x2="-30" y2="70"/>
      <line x1="30" y1="44" x2="30" y2="70"/>
    </g>
  </g>

  <text x="900" y="690" text-anchor="middle" font-size="20" fill="#1a2744" opacity="0.55" font-style="italic">Wangala · the hundred-drums festival</text>

  <!-- ===================================================== -->
  <!-- ====== RIGHT PANEL: Khasi house + food market ======= -->
  <!-- ===================================================== -->
  <g stroke="#1a2744" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- traditional thatched Khasi house -->
    <g>
      <path d="M1300 430 L1300 540 L1430 540 L1430 430 Z" fill="#eef4fb"/>
      <path d="M1280 432 Q1365 330 1450 432 Z" fill="#d9c9a8"/>
      <path d="M1280 432 Q1365 330 1450 432"/>
      <!-- thatch lines -->
      <path d="M1300 410 Q1365 350 1430 410" stroke-width="1.4" opacity="0.6"/>
      <path d="M1318 392 Q1365 348 1412 392" stroke-width="1.4" opacity="0.6"/>
      <!-- door + window -->
      <rect x="1352" y="470" width="26" height="70" fill="url(#hatch)"/>
      <rect x="1352" y="470" width="26" height="70"/>
      <rect x="1310" y="468" width="24" height="24"/>
      <rect x="1396" y="468" width="24" height="24"/>
    </g>

    <!-- bamboo stand -->
    <g stroke-width="2.2">
      <line x1="1490" y1="540" x2="1486" y2="380"/>
      <line x1="1510" y1="540" x2="1514" y2="370"/>
      <line x1="1485" y1="430" x2="1515" y2="426" stroke-width="1.6"/>
      <line x1="1486" y1="470" x2="1514" y2="468" stroke-width="1.6"/>
      <path d="M1486 380 q-22 -14 -34 4"/>
      <path d="M1514 370 q22 -16 36 6"/>
    </g>

    <!-- food: a bowl of Jadoh (red rice + pork) -->
    <g transform="translate(1340,610)" stroke-width="2.4">
      <path d="M-55 0 Q0 40 55 0 L48 -6 Q0 30 -48 -6 Z" fill="#efe6d6"/>
      <ellipse cx="0" cy="-8" rx="55" ry="16" fill="#e7d3b3"/>
      <ellipse cx="0" cy="-8" rx="55" ry="16"/>
      <!-- rice mound + bits -->
      <path d="M-30 -10 q30 -20 60 0" stroke-width="1.6"/>
      <circle cx="-12" cy="-12" r="3" fill="#cda04a"/>
      <circle cx="10" cy="-9" r="3" fill="#b8872f"/>
      <circle cx="-2" cy="-16" r="2.4" fill="#1a2744"/>
      <!-- steam -->
      <path d="M-14 -26 q-8 -14 4 -26" stroke-width="1.6" opacity="0.6"/>
      <path d="M14 -24 q8 -14 -4 -26" stroke-width="1.6" opacity="0.6"/>
    </g>

    <!-- a small plate of Pukhlein (sweet fried snack) -->
    <g transform="translate(1480,640)" stroke-width="2.2">
      <ellipse cx="0" cy="0" rx="46" ry="14" fill="#efe6d6"/>
      <ellipse cx="0" cy="0" rx="46" ry="14"/>
      <ellipse cx="-16" cy="-6" rx="16" ry="9" fill="url(#gold)"/>
      <ellipse cx="14" cy="-4" rx="16" ry="9" fill="url(#gold)"/>
      <ellipse cx="-16" cy="-6" rx="16" ry="9"/>
      <ellipse cx="14" cy="-4" rx="16" ry="9"/>
    </g>

    <!-- banana-leaf wrap (pumaloi / fish) -->
    <g transform="translate(1620,600)" stroke-width="2.2">
      <path d="M-50 0 Q-25 -26 0 -22 Q40 -16 46 6 Q20 22 -20 18 Q-46 14 -50 0 Z" fill="#aec4ab"/>
      <path d="M-44 2 Q0 -8 44 6" stroke-width="1.6" opacity="0.6"/>
    </g>
  </g>

  <text x="1500" y="690" text-anchor="middle" font-size="20" fill="#1a2744" opacity="0.55" font-style="italic">Jadoh · Pukhlein · from the Khasi hills</text>

  <!-- thin ground line tying everything together -->
  <line x1="0" y1="560" x2="1800" y2="560" stroke="#1a2744" stroke-width="2" opacity="0.25"/>
</svg>
